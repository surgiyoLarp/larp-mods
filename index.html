<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Larp SMP - Mod Candidates</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1d212b; --line:#2a2f3b;
  --text:#e6e8ee; --muted:#9aa3b2; --accent:#7aa2ff;
  --want:#3ecf8e; --look:#f5c542; --no:#ff6b6b; --added:#a78bfa; --todo:#3a4150;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:.9em}
header{padding:20px 16px 8px;max-width:1100px;margin:0 auto}
h1{margin:0 0 4px;font-size:22px}
.sub{color:var(--muted);font-size:13px}
.intro{margin:8px 0 4px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px}
.stat b{font-size:15px}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;display:flex;margin-top:8px}
.bar span{display:block;height:100%}
.tools{position:sticky;top:0;z-index:5;background:rgba(15,17,21,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.tools-in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=search],select,.note{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
input[type=search]{flex:1 1 220px;min-width:160px}
select{max-width:100%}
.chip{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#0b1020;border-color:var(--accent);font-weight:600}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#0b1020;border-color:var(--accent);font-weight:600}
.sp{flex:1}
main{max-width:1100px;margin:0 auto;padding:8px 16px 60px}
.sec{margin-top:22px}
.sec h2{font-size:17px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px}
.sec h2 small{color:var(--muted);font-weight:400;font-size:12px}
.row{display:grid;grid-template-columns:auto 1fr;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--todo);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.row.s-look{border-left-color:var(--look)}
.row.s-want{border-left-color:var(--want)}
.row.s-no{border-left-color:var(--no);opacity:.6}
.row.s-added{border-left-color:var(--added)}
.sbtns{display:grid;grid-template-columns:repeat(5,34px);gap:4px;align-content:start}
.sb{height:32px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;cursor:pointer;font-size:15px;color:var(--text);padding:0}
.sb:hover{border-color:var(--accent)}
.sb.on.k-todo{background:var(--todo)}
.sb.on.k-look{background:var(--look);color:#201a00}
.sb.on.k-want{background:var(--want);color:#00200f}
.sb.on.k-no{background:var(--no);color:#2a0000}
.sb.on.k-added{background:var(--added);color:#150a30}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.name{font-weight:600;font-size:15px}
.own{font-size:12px;border-radius:999px;padding:1px 9px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
.own.o-want{border-color:var(--want);color:var(--want)}
.own.o-look{border-color:var(--look);color:var(--look)}
.own.o-no{border-color:var(--no);color:var(--no)}
.own.o-added{border-color:var(--added);color:var(--added)}
.pri{font-size:12px;border-radius:6px;padding:0 6px;background:var(--panel2);border:1px solid var(--line)}
.pri.star{color:var(--look);border-color:var(--look)}
.compat{font-size:12px;color:var(--muted)}
.compat.warn{color:var(--look)}
.what{margin:3px 0 0}
.notes{margin:3px 0 0;color:var(--muted);font-size:13px}
.note{width:100%;margin-top:7px;font-size:13px;padding:5px 8px}
.empty{color:var(--muted);padding:30px 0;text-align:center}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:12px}
summary{cursor:pointer;font-weight:600}
details p{color:var(--muted);margin:8px 0 0}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;max-width:640px;width:calc(100% - 32px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog textarea{width:100%;height:320px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:13px/1.4 ui-monospace,Consolas,monospace}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
@media (max-width:560px){
  .row{grid-template-columns:1fr}
  .sbtns{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<header>
  <h1 id="h1">Larp SMP - Mod Candidates</h1>
  <p class="intro" id="intro" hidden></p>
  <div class="sub" id="sub"></div>
  <div class="stats" id="stats"></div>
  <div class="bar" id="bar"></div>
</header>

<div class="tools"><div class="tools-in">
  <input type="search" id="q" placeholder="Search mods, descriptions, notes..." aria-label="Search">
  <select id="sec" aria-label="Section"></select>
  <button class="chip" data-pri="">All</button>
  <button class="chip" data-pri="&#9733;" title="My short list">&#9733; Short list</button>
  <button class="chip" data-pri="&#9675;">&#9675; Optional</button>
  <select id="stf" aria-label="Status filter">
    <option value="">Any status</option>
    <option value="todo">&#9744; Undecided</option>
    <option value="look">&#128064; Looking</option>
    <option value="want">&#10004; Want</option>
    <option value="no">&#10008; Rejected</option>
    <option value="added">&#128295; Added</option>
  </select>
  <button class="chip" id="h182" title="Hide mods that need Cobblemon 1.8.2">Hide needs 1.8.2</button>
  <span class="sp"></span>
  <button class="btn primary" id="summ">Summary to send me</button>
  <button class="btn" id="dl">Download</button>
  <button class="btn" id="reset">Reset</button>
</div></div>

<main id="main"></main>

<dialog id="dlg">
  <h3 style="margin:0 0 8px">Your decisions</h3>
  <textarea id="ta" readonly></textarea>
  <div class="dlg-btns">
    <button class="btn" id="dclose">Close</button>
    <button class="btn primary" id="dcopy">Copy</button>
  </div>
</dialog>

ts","box":"todo","pri":"\u25cb","mod":"[Kanto Blocks](https://modrinth.com/project/kantoblocks) / [Models](https://modrinth.com/project/kantomodels) / [Items](https://modrinth.com/project/kantoitems) / [Teleports](https://modrinth.com/project/kantoteleports)","what":"Kanto-style building and map-making blocks","compat":"Teleports \u2705; others not scanned","notes":"","owner":"todo"},{"id":"armors","box":"todo","pri":"\u25cb","mod":"[Armors](https://modrinth.com/project/cobblemon-armors)","what":"New armor sets","compat":"\ud83e\uddea **1.8.2**","notes":"","owner":"todo"}]},{"title":"26. Pokedex and info screens","rows":[{"id":"pok-nav","box":"todo","pri":"\u25cb","mod":"[Pok\u00e9nav](https://modrinth.com/project/cobblemon-pokenav)","what":"Pok\u00e9nav item (RSE style), 11M downloads","compat":"\ud83e\uddea \u22651.8.0","notes":"","owner":"todo"},{"id":"wiki-gui","box":"todo","pri":"\u25cb","mod":"[Wiki GUI](https://modrinth.com/project/cobblemon-wiki-gui)","what":"`/pwiki` Pok\u00e9mon info","compat":"\ud83e\uddea \u22651.8.0","notes":"","owner":"todo"},{"id":"cobbledex-for-rei-emi-jei","box":"todo","pri":"\u25cb","mod":"[Cobbledex for REI/EMI/JEI](https://modrinth.com/project/cobbledex-rei-emi-jei)","what":"Cobblemon info in your recipe viewer","compat":"\ud83e\uddea","notes":"Pack already has JEI","owner":"todo"},{"id":"where-does-it-spawn","box":"todo","pri":"\u25cb","mod":"[Where Does It Spawn](https://modrinth.com/project/cobblemon-where-does-it-spawn)","what":"Search where any Pok\u00e9mon spawns","compat":"\u2705 \u22651.8.1","notes":"","owner":"todo"},{"id":"cobblemon-pok-dex","box":"todo","pri":"\u25cb","mod":"[Cobblemon Pok\u00e9dex](https://modrinth.com/project/cobblemon-pokedex)","what":"Quick species info","compat":"\ud83e\uddea \u22651.8.0","notes":"","owner":"todo"},{"id":"chiselmon","box":"todo","pri":"\u25cb","mod":"[Chiselmon](https://modrinth.com/project/chiselmon)","what":"Alerts, tooltips, PC bookmarks","compat":"\ud83e\uddea ~1.8.0","notes":"","owner":"todo"}]},{"title":"27. Party, PC and inventory tools","rows":[{"id":"more-cobblemon-tweaks","box":"todo","pri":"\u2605","mod":"[More Cobblemon Tweaks](https://modrinth.com/project/more-cobblemon-tweaks)","what":"Broad client QoL","compat":"\ud83e\uddea **1.8.2**","notes":"8M downloads","owner":"todo"},{"id":"party-extras","box":"todo","pri":"\u25cb","mod":"[Party Extras](https://modrinth.com/project/cobblemon-party-extras)","what":"Party/summary tooltips","compat":"\ud83e\uddea","notes":"","owner":"todo"},{"id":"smartphone","box":"todo","pri":"\u25cb","mod":"[Smartphone](https://modrinth.com/project/cobblemon-smartphone)","what":"Phone for healing, PC, etc.","compat":"\ud83e\uddea","notes":"","owner":"todo"},{"id":"ball-satchel","box":"todo","pri":"\u25cb","mod":"[Ball Satchel](https://modrinth.com/project/cobblemon-ball-satchel)","what":"Dedicated Pok\u00e9 Ball storage","compat":"\u2705 **1.8.2**","notes":"","owner":"todo"},{"id":"occupied-pok-balls","box":"todo","pri":"\u25cb","mod":"[Occupied Pok\u00e9balls](https://modrinth.com/project/cobblemon-occupied-pokeballs)","what":"Party Pok\u00e9mon as a physical Pok\u00e9 Ball item","compat":"\u2705 \u22651.7.1","notes":"","owner":"todo"},{"id":"ev-tracker-ev-iv-display-curseforge","box":"todo","pri":"\u25cb","mod":"[EV Tracker](https://www.curseforge.com/minecraft/mc-mods/cobble-ev-tracker) / [EV\u0026IV Display](https://www.curseforge.com/minecraft/mc-mods/ev-iv-display-cobblemon) (CurseForge)","what":"Client HUDs for EVs/IVs","compat":"EV Tracker \u2705; Display not scanned","notes":"","owner":"todo"}]}],"info":[{"title":"Already in the pack \u2014 upgrade, don\u0027t re-add","text":"Mega Showdown 1.2.0 \u2192 1.3.1 (needs Cobblemon 1.8.2) \u00b7 Catch Rate Display 2.8.22 \u2192 2.12.3 \u00b7 Catch Indicator 1.7.0 \u2192 3.0 \u00b7 Pokeblocks 1.4.0 \u2192 1.5.0 \u00b7 Battle Extras 1.13.45 (current) \u00b7 Cobblemon Integrations 1.1.8 (current)"},{"title":"Do not install on 1.8.x","text":"Spawn Alerts \u00b7 NoValidation \u00b7 UI Tweaks \u00b7 Ride On \u00b7 Academy Integration \u00b7 Interact Wheel Additions \u00b7 Granular Shinies \u00b7 Cobblemon Snap \u00b7 Outbreaks \u00b7 Nests \u0026 Dens \u00b7 Cobbletracker \u00b7 Special Fossils (1.7.3 only) \u00b7 CobblePCEnhanced (\u003c1.8.2) \u00b7 EV Uncapper (1.7.3 only) \u00b7 Catch On Defeat and Linkie (1.8.1 only; break on 1.8.2) \u00b7 Pokerus, Drop Loot Tables, Pasture Collector (1.8.1 only) \u00b7 Mega Showdown Ores / Cobblemore Lib / Simple Pok\u00e9centers (missing Pommel library)"},{"title":"Mutually exclusive","text":"Battle Extras \u21c4 UI Tweaks / CobbleStats / Move Inspector \u00b7 Mega Showdown \u21c4 AllTheMons \u00b7 Journey Mounts \u21c4 Lost Lore \u00b7 pick one economy \u00b7 pick one badge mod \u00b7 pick one dex-reward mod"}],"title":"Larp SMP Mod Wishlist","intro":"Mods I am looking at for the server. The tag on each one shows where I am at so far. Tap the buttons to give me your take (check = want, cross = nah, eyes = maybe) and add a note if you feel like it. When you are done, hit Send my picks and text me what it gives you.","summaryLabel":"Send my picks"};
const KEY = 'larp-mod-candidates-v1';
const ST = [
  {k:'todo', i:'☐', l:'Undecided'},
  {k:'look', i:'👀', l:'Looking into it'},
  {k:'want', i:'✔', l:'Want it'},
  {k:'no',   i:'✘', l:'Rejected'},
  {k:'added',i:'🔧', l:'Already added'}
];
let saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { saved = {}; }
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }

const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function inline(s){
  let t = esc(s);
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  return t;
}
function plain(s){
  return String(s || '').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\*\*/g,'').replace(/`/g,'').trim();
}

const rows = [];
DATA.sections.forEach((s, si) => s.rows.forEach(r => rows.push(Object.assign({}, r, {si: si}))));
const statusOf = r => (saved[r.id] && saved[r.id].status) || r.box || 'todo';
const noteOf = r => (saved[r.id] && saved[r.id].note) || '';
const needs182 = r => String(r.compat).indexOf('1.8.2') !== -1;
const only181 = r => /1\.8\.1 only/.test(String(r.compat));

const F = {q:'', sec:'', pri:'', stf:'', h182:false};

function setStatus(id, k){
  const r = rows.find(x => x.id === id);
  saved[id] = Object.assign({}, saved[id], {status: k});
  // keep the file's own mark if the user picks the same thing, so nothing is stored needlessly
  if (r && r.box === k && !saved[id].note) delete saved[id];
  persist();
}
function setNote(id, v){
  const cur = saved[id] || {};
  saved[id] = Object.assign({}, cur, {note: v});
  if (!v && !saved[id].status) delete saved[id];
  persist();
}

function visible(r){
  if (F.sec !== '' && String(r.si) !== F.sec) return false;
  if (F.pri && r.pri !== F.pri) return false;
  if (F.stf && statusOf(r) !== F.stf) return false;
  if (F.h182 && needs182(r)) return false;
  if (F.q){
    const hay = (plain(r.mod)+' '+plain(r.what)+' '+plain(r.notes)+' '+plain(r.compat)+' '+noteOf(r)).toLowerCase();
    if (!F.q.toLowerCase().split(/\s+/).every(w => hay.indexOf(w) !== -1)) return false;
  }
  return true;
}

const OWN_LABEL = {want:'My pick: want', look:'My pick: looking into it', no:'My pick: passed', added:'My pick: already in the pack'};
function ownerPill(r){
  if (!r.owner || r.owner === 'todo' || !OWN_LABEL[r.owner]) return '';
  return '<span class="own o-'+r.owner+'">'+OWN_LABEL[r.owner]+'</span>';
}

function rowHtml(r){
  const k = statusOf(r);
  const btns = ST.map(s => '<button class="sb k-'+s.k+(s.k===k?' on':'')+'" data-id="'+esc(r.id)+'" data-k="'+s.k+'" title="'+s.l+'" aria-label="'+s.l+'">'+s.i+'</button>').join('');
  const warn = only181(r) ? ' warn' : '';
  const star = r.pri === '★' ? ' star' : '';
  return '<article class="row s-'+k+'" data-id="'+esc(r.id)+'">'
    + '<div class="sbtns">'+btns+'</div>'
    + '<div><div class="top"><span class="pri'+star+'">'+esc(r.pri)+'</span><span class="name">'+inline(r.mod)+'</span>'+ownerPill(r)+'<span class="compat'+warn+'">'+inline(r.compat)+'</span></div>'
    + '<p class="what">'+inline(r.what)+'</p>'
    + (r.notes ? '<p class="notes">'+inline(r.notes)+'</p>' : '')
    + '<input class="note" data-id="'+esc(r.id)+'" placeholder="Your note..." value="'+esc(noteOf(r))+'"></div>'
    + '</article>';
}

function render(){
  const main = document.getElementById('main');
  let html = '', shown = 0;
  DATA.sections.forEach((s, si) => {
    const list = rows.filter(r => r.si === si && visible(r));
    if (!list.length) return;
    shown += list.length;
    html += '<section class="sec"><h2>'+esc(s.title)+' <small>'+list.length+' of '+s.rows.length+'</small></h2>'+list.map(rowHtml).join('')+'</section>';
  });
  if (!shown) html = '<div class="empty">Nothing matches those filters.</div>';
  DATA.info.forEach(p => {
    html += '<details><summary>'+esc(p.title)+'</summary><p>'+inline(p.text)+'</p></details>';
  });
  main.innerHTML = html;
  stats();
}

function stats(){
  const c = {todo:0, look:0, want:0, no:0, added:0};
  rows.forEach(r => { c[statusOf(r)]++; });
  const tot = rows.length;
  const el = document.getElementById('stats');
  el.innerHTML = ST.map(s => '<span class="stat">'+s.i+' '+s.l+' <b>'+c[s.k]+'</b></span>').join('') + '<span class="stat">Total <b>'+tot+'</b></span>';
  const colors = {todo:'var(--todo)', look:'var(--look)', want:'var(--want)', no:'var(--no)', added:'var(--added)'};
  document.getElementById('bar').innerHTML = ST.map(s => '<span style="width:'+(100*c[s.k]/tot)+'%;background:'+colors[s.k]+'"></span>').join('');
}

function summary(){
  const g = {want:[], look:[], no:[], added:[]};
  rows.forEach(r => { const k = statusOf(r); if (g[k]) g[k].push(r); });
  const line = r => '- ' + plain(r.mod) + (noteOf(r) ? '  [' + noteOf(r) + ']' : '');
  const head = {want:'WANT (add to the test pack)', look:'LOOKING INTO', no:'REJECTED', added:'ALREADY ADDED'};
  let out = 'LARP SMP MOD DECISIONS - ' + new Date().toISOString().slice(0,10) + '\n';
  ['want','look','no','added'].forEach(k => {
    out += '\n' + head[k] + ' (' + g[k].length + ')\n' + (g[k].length ? g[k].map(line).join('\n') : '- none') + '\n';
  });
  const unrated = rows.filter(r => statusOf(r) === 'todo').length;
  out += '\nUNDECIDED: ' + unrated + ' mods\n';
  return out;
}

document.addEventListener('click', e => {
  const sb = e.target.closest('.sb');
  if (sb){
    setStatus(sb.dataset.id, sb.dataset.k);
    const row = sb.closest('.row');
    row.className = 'row s-' + sb.dataset.k;
    row.querySelectorAll('.sb').forEach(b => b.classList.toggle('on', b === sb));
    stats();
    if (F.stf) render();
    return;
  }
});
document.addEventListener('input', e => {
  if (e.target.classList.contains('note')) setNote(e.target.dataset.id, e.target.value);
});

const q = document.getElementById('q');
q.addEventListener('input', () => { F.q = q.value.trim(); render(); });
const secSel = document.getElementById('sec');
secSel.innerHTML = '<option value="">All sections</option>' + DATA.sections.map((s,i) => '<option value="'+i+'">'+esc(s.title)+'</option>').join('');
secSel.addEventListener('change', () => { F.sec = secSel.value; render(); });
document.getElementById('stf').addEventListener('change', e => { F.stf = e.target.value; render(); });
document.querySelectorAll('[data-pri]').forEach(b => {
  b.addEventListener('click', () => {
    F.pri = b.dataset.pri;
    document.querySelectorAll('[data-pri]').forEach(x => x.classList.toggle('on', x === b));
    render();
  });
});
document.querySelector('[data-pri=""]').classList.add('on');
const h = document.getElementById('h182');
h.addEventListener('click', () => { F.h182 = !F.h182; h.classList.toggle('on', F.h182); render(); });

const dlg = document.getElementById('dlg'), ta = document.getElementById('ta');
document.getElementById('summ').addEventListener('click', () => { ta.value = summary(); dlg.showModal(); ta.focus(); ta.select(); });
document.getElementById('dclose').addEventListener('click', () => dlg.close());
document.getElementById('dcopy').addEventListener('click', () => {
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(() => {});
  document.getElementById('dcopy').textContent = 'Copied';
  setTimeout(() => { document.getElementById('dcopy').textContent = 'Copy'; }, 1500);
});
document.getElementById('dl').addEventListener('click', () => {
  const blob = new Blob([summary()], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'larp-mod-decisions-' + new Date().toISOString().slice(0,10) + '.txt';
  document.body.appendChild(a); a.click(); a.remove();
});
document.getElementById('reset').addEventListener('click', () => {
  if (confirm('Clear all your choices and notes in this browser and go back to the checklist file\'s marks?')){
    saved = {}; persist(); render();
  }
});

if (DATA.title) { document.title = DATA.title; document.getElementById('h1').textContent = DATA.title; }
if (DATA.intro) { const el = document.getElementById('intro'); el.textContent = DATA.intro; el.hidden = false; }
if (DATA.summaryLabel) document.getElementById('summ').textContent = DATA.summaryLabel;
document.getElementById('sub').textContent = DATA.subtitle + ' · built ' + DATA.built + ' · choices are saved in this browser';
render();
</script>
</body>
</html>
